name: Publish openinfer-simulator

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish generator crate
        run: cargo publish --manifest-path generator/Cargo.toml --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Wait for generator on crates.io
        run: |
          set -euo pipefail
          crate_name="openinfer-simulator-generator"
          crate_version="$(cargo metadata --format-version=1 --manifest-path generator/Cargo.toml | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' | head -n 1)"
          echo "Waiting for ${crate_name} ${crate_version} to appear on crates.io..."
          for attempt in $(seq 1 30); do
            if curl -fsSL "https://crates.io/api/v1/crates/${crate_name}/${crate_version}" >/dev/null; then
              echo "Found ${crate_name} ${crate_version} on crates.io"
              exit 0
            fi
            echo "Not yet available (attempt ${attempt}/30). Sleeping 10s..."
            sleep 10
          done
          echo "Timed out waiting for ${crate_name} ${crate_version} on crates.io"
          exit 1
      - name: Publish simulator crate
        run: cargo publish --manifest-path Cargo.toml --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
