[package]
name = "openinfer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openinfer-dsl = { git = "https://github.com/arsalan-anwari/openinfer-dsl.git" }
rand = "0.8"
memmap2 = "0.9"
rayon = "*"
once_cell = "1"
bytemuck = { version = "1", features = ["derive"] }
ash = "0.38.0"

[build-dependencies]
openinfer-generator = { path = "generator" }

[dev-dependencies]

[features]
vulkan = []
